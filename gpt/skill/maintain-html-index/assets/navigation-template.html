<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --ink: #26282c; --muted: #626974; --line: #e4e6e9; --hover: #f3efff; --link: #7c3aed; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 38px 32px 72px; }
    header { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0 0 9px; font-size: 21px; font-weight: 600; overflow-wrap: anywhere; }
    nav { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; }
    a { color: var(--link); text-decoration: none; overflow-wrap: anywhere; }
    a:hover { text-decoration: underline; }
    a:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 3px; }
    ul { list-style: none; margin: 0; padding: 0; }
    .tree ul { margin-left: 9px; padding-left: 22px; border-left: 1px solid var(--line); }
    li { margin: 3px 0; }
    summary { cursor: pointer; padding: 5px 8px; border-radius: 5px; overflow-wrap: anywhere; }
    summary::marker { color: var(--link); font-size: 11px; }
    summary:hover, .leaf:hover { background: var(--hover); }
    .folder { font-weight: 550; }
    .folder-link { color: inherit; }
    .folder-link:hover { color: var(--link); }
    .leaf { display: block; padding: 5px 8px; border-radius: 5px; }
    @media (max-width: 560px) { main { padding: 24px 16px 48px; } .tree ul { padding-left: 15px; } }
    @media (prefers-color-scheme: dark) { :root { --bg: #202124; --ink: #e4e6eb; --muted: #a6acb6; --line: #383c43; --hover: #352b49; --link: #c4b5fd; } }

  </style>
<style id="index-controls-style">.index-actions{display:flex;flex-shrink:0}.index-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:9px}.index-heading h1{margin:0;flex:1;min-width:0}.tree-toggle{display:grid;place-items:center;width:40px;height:40px;padding:8px;color:var(--muted);background:none;border:0;border-radius:0;box-shadow:none;cursor:pointer}.tree-toggle:hover{color:var(--link)}.tree-toggle:focus-visible{outline:2px solid var(--link);outline-offset:3px}.tree-toggle:disabled{opacity:.35;cursor:default}.tree-toggle[data-action="expand"] .collapse-icon,.tree-toggle[data-action="collapse"] .expand-icon{display:none}</style>
<style id="scrollbar-style">{{SCROLLBAR_STYLE}}</style>
<style id="page-zoom-style">{{PAGE_ZOOM_STYLE}}</style>
</head>
<body>
  <main>
    <header>
      <div class="index-heading"><h1>{{TITLE}}</h1><div class="index-actions"><button class="tree-toggle" type="button" data-tree-toggle data-action="expand" title="全部展开" aria-label="全部展开"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="expand-icon" d="m6 8 6-5 6 5 M6 16l6 5 6-5"/><path class="collapse-icon" d="m6 3 6 5 6-5 M6 21l6-5 6 5"/></svg></button></div></div>
      <!-- NAV_LINKS: 仅上一级、总索引、课程页面；报告作为 TREE 内的普通文件叶节点。 -->
      <nav aria-label="导航">{{NAV_LINKS}}</nav>
    </header>
    <!-- TREE: 同页递归 details/summary 直到实际文件；保留同页递归树；文件夹名称另链接到集中存放的子目录页，箭头负责折叠。报告.html 仅一个文件叶节点；资料内按中文稿、原文稿（源 PDF/Word）、在线入口排序；默认无英文 MD/HTML。 -->

    <ul class="tree" aria-label="资料目录">{{TREE}}</ul>
  </main>
<script id="page-zoom-script" src="{{PAGE_ZOOM_SCRIPT}}"></script>
<script src="{{READING_POSITION_SCRIPT}}"></script>
<!-- codex-index-state:start -->
<script>
// Remember each index independently; keys follow heading ancestry, not list position.
(() => {
  const tree = document.querySelector('.tree');
  if (!tree) return;
  const branches = Array.from(tree.querySelectorAll('details'));
  const buttons = Array.from(document.querySelectorAll('[data-tree-toggle]'));
  function syncButton() {
    const anyOpen = branches.some(node => node.open);
    buttons.forEach(button => {
      button.disabled = branches.length === 0;
      button.dataset.action = anyOpen ? 'collapse' : 'expand';
      button.title = anyOpen ? '全部收起' : '全部展开';
      button.setAttribute('aria-label', button.title);
    });
  }
  const label = node => node.querySelector('summary').textContent.trim();
  const parent = node => node.parentElement.closest('details');
  const keys = new Map();
  function key(node) {
    if (keys.has(node)) return keys.get(node);
    const owner = parent(node);
    const peers = branches.filter(other => parent(other) === owner && label(other) === label(node));
    const parts = owner ? JSON.parse(key(owner)) : [];
    parts.push([label(node), peers.indexOf(node)]);
    const value = JSON.stringify(parts);
    keys.set(node, value);
    return value;
  }
  branches.forEach(key);
  const storageKey = 'course-index:v1:' + location.href.split(/[?#]/)[0];
  const stores = [];
  for (const name of ['localStorage', 'sessionStorage']) {
    try { const store = window[name]; store.getItem(storageKey); stores.push(store); } catch (_) {}
  }
  function save() {
    syncButton();
    const state = JSON.stringify({version:1, open:branches.filter(node => node.open).map(key), scroll:window.scrollY});
    for (const store of stores) { try { store.setItem(storageKey, state); } catch (_) {} }
  }
  const motions=new Map(),motionPreference=window.matchMedia?.('(prefers-reduced-motion: reduce)');
  function stopMotion(){for(const animation of motions.values())animation.cancel();motions.clear();}
  motionPreference?.addEventListener?.('change',stopMotion);
  window.addEventListener('resize',stopMotion);
  document.addEventListener('page-scalechange',stopMotion);
  function changeBranches(nodes,open){
    const animate=!motionPreference?.matches&&typeof tree.animate==='function';
    const zoom=Number(document.body.style.zoom)||1;
    // Only animate the outer changed branches; nested heights must not compound.
    const outer=nodes.filter(node=>!nodes.some(other=>other!==node&&other.contains(node)));
    const previous=animate?outer.map(node=>[node,node.getBoundingClientRect().height/zoom]):[];
    stopMotion();
    nodes.forEach(node=>{node.open=open;});
    for(const [node,height] of previous){
      const next=node.getBoundingClientRect().height/zoom;
      if(Math.abs(height-next)<.5)continue;
      const animation=node.animate([
        {height:height+'px',overflow:'clip',boxSizing:'border-box'},
        {height:next+'px',overflow:'clip',boxSizing:'border-box'}
      ],{duration:200,easing:'cubic-bezier(.2,.7,.2,1)'});
      motions.set(node,animation);
      animation.onfinish=()=>{if(motions.get(node)===animation)motions.delete(node);};
    }
    save();
  }
  function restore() {
    stopMotion();
    for (const store of stores) {
      try {
        const state = JSON.parse(store.getItem(storageKey));
        if (!state || state.version !== 1 || !Array.isArray(state.open)) continue;
        const open = new Set(state.open);
        branches.forEach(node => { node.open = open.has(key(node)); });
        if (!window.FileIndexPosition && Number.isFinite(state.scroll)) requestAnimationFrame(() => window.scrollTo(0, state.scroll));
        break;
      } catch (_) {}
    }
    syncButton();
  }
  restore();
  branches.forEach(node => node.addEventListener('toggle', save));
  tree.addEventListener('click', event => {
    if(event.target.closest('a')){save();return;}
    const summary=event.target.closest('summary');
    if(!summary||!tree.contains(summary)||event.defaultPrevented||event.button>0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
    event.preventDefault();
    changeBranches([summary.parentElement],!summary.parentElement.open);
  });
  buttons.forEach(button => button.addEventListener('click', () => {
    const open = !branches.some(node => node.open);
    changeBranches(branches,open);
  }));
  window.addEventListener('pagehide', save);
  window.addEventListener('pageshow', restore);
})();
</script>
<!-- codex-index-state:end -->
</body>
</html>
